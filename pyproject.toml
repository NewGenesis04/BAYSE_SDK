[project]
name = "bayse-markets"
version = "0.3.1"
description = "Async Python SDK for the Bayse Markets prediction market API"
readme = "README.md"
authors = [
    { name = "Ogie Omorose", email = "omoroseogie03@gmail.com" },
]
license = "MIT"
requires-python = ">=3.12"
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
]

[project.urls]
Repository = "https://github.com/NewGenesis04/BAYSE_SDK"

[build-system]
# >=77 required for PEP 639 SPDX license expression (license = "MIT")
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-recording>=0.13.4",
    "ruff>=0.15.20",
    "ty>=0.0.57",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["N813", "N815", "N816"]

[tool.ruff.lint.per-file-ignores]
"src/bayse_markets/models/*.py" = ["N802", "N803", "N806", "N807"]
"src/bayse_markets/**/models.py" = ["N802", "N803", "N806", "N807"]

[tool.ruff.format]
quote-style = "double"



[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
